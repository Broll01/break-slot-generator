<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Dynamic Break Slot Generator Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-color: #09090b;
      --card-bg: rgba(24, 24, 27, 0.8);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-1: #8b5cf6;
      --accent-2: #3b82f6;
      --accent-3: #10b981;
      --input-bg: rgba(0, 0, 0, 0.4);
      --pre-bg: rgba(0, 0, 0, 0.5);
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    body.light-mode {
      --bg-color: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border-color: rgba(0, 0, 0, 0.12);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent-1: #7c3aed;
      --accent-2: #2563eb;
      --accent-3: #059669;
      --input-bg: rgba(255, 255, 255, 0.9);
      --pre-bg: rgba(255, 255, 255, 0.98);
    }

    * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 15px;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .bg-animation {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1; overflow: hidden; background: inherit;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35;
      animation: float 15s infinite alternate ease-in-out;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--accent-1); top: -10%; left: -10%; }
    .orb-2 { width: 350px; height: 350px; background: var(--accent-2); bottom: -10%; right: -5%; animation-delay: -5s; }
    .orb-3 { width: 300px; height: 300px; background: var(--accent-3); top: 40%; left: 40%; animation-delay: -10s; opacity: 0.2; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.2); }
    }

    .container { width: 100%; max-width: 820px; z-index: 1; }

    .header-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
    }

    .theme-toggle {
      background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 6px; transition: all 0.3s ease;
    }
    .theme-toggle:hover { border-color: var(--accent-2); }

    .card {
      background: var(--card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color); padding: 30px; border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); margin-bottom: 24px;
      transition: all 0.4s ease;
    }

    h2 {
      font-size: 26px; font-weight: 800; text-align: center;
      background: linear-gradient(to right, var(--accent-1), var(--accent-2), var(--accent-3));
      -webkit-background-clip: text; color: transparent;
      animation: gradientShift 6s ease infinite; background-size: 200% auto;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
    }

    .label-row {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-top: 18px; margin-bottom: 8px;
    }

    label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    .btn-action-text {
      background: none; border: none; color: var(--accent-2); font-size: 12px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px;
    }
    .btn-action-text:hover { text-decoration: underline; }

    select, textarea, input[type="text"], input[type="time"] {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 12px; border-radius: 12px; font-size: 13.5px;
      transition: all 0.3s ease; outline: none; font-weight: 500;
    }

    select, input[type="time"] { cursor: pointer; }
    select:focus, textarea:focus, input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15); }

    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }

    .timing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 5px; }
    .timing-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 5px; }
    .timing-grid input, .timing-grid select, .timing-grid-3 select { text-align: center; font-size: 13px; font-weight: 600; padding: 12px 10px; }

    /* Management Panel Styles */
    .manager-box {
      background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border-color);
      padding: 18px; border-radius: 16px; margin-top: 10px; display: none;
      flex-direction: column; gap: 14px;
    }
    .manager-box.open { display: flex; }
    .manager-section {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 12px; border-radius: 12px;
    }
    .manager-title { font-size: 12px; font-weight: 700; color: #60a5fa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .dept-edit-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .dept-edit-row select, .dept-edit-row input { font-size: 12.5px; padding: 9px 12px; flex: 1; min-width: 140px; }
    .btn-sm { padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; white-space: nowrap; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-1); }

    .btn {
      width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 15px;
      font-weight: 700; color: white; cursor: pointer; display: flex; justify-content: center;
      align-items: center; gap: 8px; transition: all 0.3s; margin-top: 20px;
    }
    .btn:active { transform: scale(0.98); }

    .btn-submit { background: linear-gradient(135deg, var(--accent-3) 0%, #059669 100%); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.25); }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4); }

    .action-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .btn-copy { background: linear-gradient(135deg, var(--accent-2) 0%, #2563eb 100%); margin-top: 0; flex: 1; }
    .btn-download { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); margin-top: 0; flex: 1; }
    .btn-image { background: linear-gradient(135deg, var(--accent-1) 0%, #6d28d9 100%); margin-top: 0; flex: 1; }

    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;}
    .agent-count { background: var(--accent-1); color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    
    .breakdown-box {
      background: var(--input-bg); border: 1px solid var(--border-color);
      padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 12.5px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .breakdown-badge { background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 6px; font-weight: 600; }

    .slot-table-container {
      overflow-x: auto; margin-top: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border-color);
    }
    .slot-matrix-table {
      width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; background: var(--pre-bg);
    }
    .slot-matrix-table th, .slot-matrix-table td {
      padding: 10px 12px; border: 1px solid var(--border-color); white-space: nowrap;
    }
    .slot-matrix-table th { background: rgba(255,255,255,0.08); color: #60a5fa; font-weight: 700; }
    .slot-matrix-table td.dept-col { text-align: left; font-weight: 600; color: #f3f4f6; }
    .slot-matrix-table td.slot-num { font-weight: 700; color: #34d399; }
    .slot-matrix-table tr.total-row { background: rgba(59, 130, 246, 0.15); font-weight: 800; }
    .slot-matrix-table tr.total-row td { color: #60a5fa; }

    .search-input { margin-bottom: 12px; padding: 10px 14px; font-size: 13px; }

    pre {
      background: var(--pre-bg); color: var(--text-main); padding: 18px; border-radius: 12px;
      white-space: pre-wrap; font-size: 13.5px; font-family: 'Courier New', monospace;
      border: 1px solid var(--border-color); max-height: 400px; overflow-y: auto;
    }

    #toast {
      visibility: hidden; min-width: 280px; background: var(--text-main); color: var(--bg-color);
      text-align: center; border-radius: 30px; padding: 14px 24px; position: fixed; z-index: 100;
      left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); font-weight: 700;
      font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); opacity: 0; transition: all 0.4s;
    }
    #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="bg-animation">
    <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  </div>

  <div class="container">
    
    <div class="header-row">
      <div></div>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
    </div>

    <div class="card">
      <h2>🚀 Smart Dynamic Break Generator Pro</h2>
      
      <div class="label-row"><label>Date & Session</label></div>
      <div class="timing-grid">
        <select id="dateSelect"></select>
        <select id="sessionTypeSelect" onchange="handleSessionChange()">
          <option value="Morning Break" selected>Morning Break</option>
          <option value="Evening Break">Evening Break</option>
        </select>
      </div>

      <div class="label-row"><label>Break Start, Duration & Total Slots</label></div>
      <div class="timing-grid-3">
        <input type="time" id="startTimePicker" value="08:30">
        <select id="slotDurationSelect">
          <option value="15">15 Mins Slot</option>
          <option value="30" selected>30 Mins Slot</option>
          <option value="45">45 Mins Slot</option>
          <option value="60">1 Hour Slot</option>
        </select>
        <select id="slotCountSelect">
          <option value="2">2 Slots</option>
          <option value="3" selected>3 Slots</option>
          <option value="4">4 Slots</option>
          <option value="5">5 Slots</option>
        </select>
      </div>

      <div class="label-row">
        <label>Agent Database & Management</label>
        <div style="display: flex; gap: 10px;">
          <button class="btn-action-text" onclick="toggleManagerBox()">⚙️ Manage Panel</button>
          <button class="btn-action-text" onclick="loadDefaultData()">📥 Reset Default</button>
        </div>
      </div>

      <!-- Management Panel -->
      <div class="manager-box" id="managerBox">
        
        <!-- 1. Department Settings -->
        <div class="manager-section">
          <div class="manager-title">📁 Department Operations (Add / Delete)</div>
          <div class="dept-edit-row" style="margin-bottom: 8px;">
            <input type="text" id="newDeptName" placeholder="New Dept Name (e.g. AG Mart)">
            <button class="btn-sm" style="background:var(--accent-2); color:white;" onclick="addNewDeptUI()">➕ Add Dept</button>
          </div>
          <div class="dept-edit-row">
            <select id="removeDeptSelect"></select>
            <button class="btn-sm" style="background:var(--danger); color:white;" onclick="removeDeptUI()">🗑️ Delete Dept</button>
          </div>
        </div>

        <!-- 2. Agent Settings -->
        <div class="manager-section">
          <div class="manager-title">👤 Agent Operations (Add / Delete)</div>
          <div class="dept-edit-row" style="margin-bottom: 8px;">
            <input type="text" id="newAgentName" placeholder="Agent Name (e.g. Md. Rahim)">
            <select id="targetDeptSelect"></select>
            <button class="btn-sm" style="background:var(--accent-3); color:white;" onclick="addNewAgentUI()">➕ Add Agent</button>
          </div>
          <div class="dept-edit-row">
            <select id="removeAgentSelect"></select>
            <button class="btn-sm" style="background:var(--danger); color:white;" onclick="removeAgentUI()">🗑️ Delete Agent</button>
          </div>
        </div>

        <!-- 3. Transfer Settings -->
        <div class="manager-section">
          <div class="manager-title">🔄 Transfer Agent to Another Dept</div>
          <div class="dept-edit-row">
            <select id="transferAgentSelect"></select>
            <span style="font-size:12px; color:var(--text-muted);">➡️</span>
            <select id="transferDeptSelect"></select>
            <button class="btn-sm" style="background:var(--accent-1); color:white;" onclick="transferAgentUI()">🔁 Move</button>
          </div>
        </div>

      </div>

      <textarea id="agentData" rows="14" placeholder="Paste or edit agent list here..." oninput="saveToLocal()"></textarea>

      <button class="btn btn-submit" onclick="generateSchedule()">
        ⚡ Generate Random & Equal Schedule
      </button>
    </div>

    <!-- Output Card -->
    <div class="card" id="outputCard" style="display: none;">
      <div id="exportableArea" style="padding: 10px; border-radius: 12px;">
        <div class="output-header">
          <label style="margin: 0;">Schedule Output (Randomized)</label>
          <span class="agent-count" id="agentCountBadge">Total: 0</span>
        </div>

        <div class="label-row" style="margin-top: 10px; margin-bottom: 6px;"><label>Overall Department Breakdown</label></div>
        <div class="breakdown-box" id="breakdownContainer"></div>

        <div class="label-row" style="margin-top: 14px; margin-bottom: 6px;"><label>Slot-wise Agent Breakdown Matrix</label></div>
        <div class="slot-table-container" id="slotMatrixContainer"></div>

        <pre id="outputResult"></pre>
      </div>

      <input type="text" id="agentSearch" class="search-input" placeholder="🔍 Search agent name in schedule..." onkeyup="filterSchedule()">
      
      <div class="action-row">
        <button class="btn btn-copy" onclick="copyText()">📋 Copy Text</button>
        <button class="btn btn-download" onclick="downloadText()">⬇️ Download .txt</button>
        <button class="btn btn-image" onclick="exportToImage()">🖼️ Export Image (PNG)</button>
      </div>
    </div>
  </div>

  <div id="toast">✅ Done!</div>

  <script>
    const DEFAULT_AGENT_TEXT = `Message Team

    const SENIOR_AGENTS = [
      "Md. Lehadujjaman", "Md Amir Hossen", "Md Zihad Hossain",
      "Ujjal Ullah Papon", "Alifur Rahman", 
      "Rezaul Hossain Rakib", "MD. Tasin Hossain Hawlader Rinku", 
      "Md Aminul islam", "Md Irfan Ahmed",
      "Md Fardin Hasan", "Seaim Rahman", "Rafid Bin Karim"
    ].map(s => s.trim().toLowerCase());

    let fullGeneratedText = "";

    window.onload = function() {
      populateDateDropdown();
      loadTheme();
      const savedData = localStorage.getItem("savedAgentData_vPerfectFix4");
      if (savedData) {
        document.getElementById("agentData").value = savedData;
      } else {
        loadDefaultData();
      }
      syncManagementDropdowns();
    };

    function saveToLocal() {
      localStorage.setItem("savedAgentData_vPerfectFix4", document.getElementById("agentData").value);
      syncManagementDropdowns();
    }
    
    function loadDefaultData() {
      document.getElementById("agentData").value = DEFAULT_AGENT_TEXT;
      saveToLocal();
      showToast("📥 Default list loaded!");
    }

    function toggleManagerBox() {
      const box = document.getElementById("managerBox");
      box.classList.toggle("open");
      if(box.classList.contains("open")) {
        syncManagementDropdowns();
      }
    }

    // Fully Robust Line-based Department & Agent Parser Engine
    function parseStructure() {
      const text = document.getElementById("agentData").value;
      const lines = text.split('\n');
      const data = {};
      let currentDept = null;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        
        // Dynamic detection of Department headers vs Agent Names
        const isAgent = trimmed.startsWith("Md.") || trimmed.startsWith("MD.") || 
                        (trimmed.split(' ').length >= 2 && 
                         !trimmed.toLowerCase().includes("team") && 
                         !trimmed.toLowerCase().includes("call") && 
                         !trimmed.toLowerCase().includes("web") && 
                         !trimmed.toLowerCase().includes("qmt") && 
                         !trimmed.toLowerCase().includes("recell") && 
                         !trimmed.toLowerCase().includes("order") && 
                         !trimmed.toLowerCase().includes("review") && 
                         !trimmed.toLowerCase().includes("mart") && 
                         !trimmed.toLowerCase().includes("support") &&
                         !trimmed.toLowerCase().includes("dept"));

        if (!isAgent && trimmed.length < 35 && !trimmed.includes(",")) {
          currentDept = trimmed;
          if (!data[currentDept]) data[currentDept] = [];
        } else {
          if (currentDept) {
            data[currentDept].push(trimmed);
          }
        }
      });
      return data;
    }

    function stringifyStructure(dataObj) {
      let result = "";
      Object.keys(dataObj).forEach(dept => {
        result += `${dept}\n`;
        dataObj[dept].forEach(agent => {
          result += `${agent}\n`;
        });
        result += `\n`;
      });
      return result.trim();
    }

    function syncManagementDropdowns() {
      const dataObj = parseStructure();
      const depts = Object.keys(dataObj);
      let allAgents = [];

      const targetDeptSelect = document.getElementById("targetDeptSelect");
      const removeDeptSelect = document.getElementById("removeDeptSelect");
      const transferDeptSelect = document.getElementById("transferDeptSelect");

      if (!targetDeptSelect || !removeDeptSelect || !transferDeptSelect) return;

      targetDeptSelect.innerHTML = "";
      removeDeptSelect.innerHTML = "";
      transferDeptSelect.innerHTML = "";

      depts.forEach(d => {
        targetDeptSelect.innerHTML += `<option value="${d}">${d}</option>`;
        removeDeptSelect.innerHTML += `<option value="${d}">${d}</option>`;
        transferDeptSelect.innerHTML += `<option value="${d}">${d}</option>`;

        if (dataObj[d]) {
          dataObj[d].forEach(a => {
            allAgents.push({ name: a, dept: d });
          });
        }
      });

      const removeAgentSelect = document.getElementById("removeAgentSelect");
      const transferAgentSelect = document.getElementById("transferAgentSelect");

      removeAgentSelect.innerHTML = "";
      transferAgentSelect.innerHTML = "";

      allAgents.forEach(item => {
        removeAgentSelect.innerHTML += `<option value="${item.name}">${item.name} (${item.dept})</option>`;
        transferAgentSelect.innerHTML += `<option value="${item.name}">${item.name} (${item.dept})</option>`;
      });
    }

    function addNewDeptUI() {
      const newDept = document.getElementById("newDeptName").value.trim();
      if (!newDept) { alert("Please enter department name!"); return; }
      const dataObj = parseStructure();
      if (dataObj[newDept]) { alert("Department already exists!"); return; }
      
      dataObj[newDept] = [];
      document.getElementById("agentData").value = stringifyStructure(dataObj);
      saveToLocal();
      document.getElementById("newDeptName").value = "";
      showToast(`📁 Added department: ${newDept}`);
    }

    function removeDeptUI() {
      const deptToRemove = document.getElementById("removeDeptSelect").value;
      if (!deptToRemove) return;
      if (confirm(`Are you sure you want to delete "${deptToRemove}" and all its agents?`)) {
        const dataObj = parseStructure();
        delete dataObj[deptToRemove];
        document.getElementById("agentData").value = stringifyStructure(dataObj);
        saveToLocal();
        showToast(`🗑️ Removed department: ${deptToRemove}`);
      }
    }

    function addNewAgentUI() {
      const name = document.getElementById("newAgentName").value.trim();
      const dept = document.getElementById("targetDeptSelect").value;
      if (!name) { alert("Please enter agent name!"); return; }
      
      const dataObj = parseStructure();
      if (!dataObj[dept]) dataObj[dept] = [];
      dataObj[dept].push(name);

      document.getElementById("agentData").value = stringifyStructure(dataObj);
      saveToLocal();
      document.getElementById("newAgentName").value = "";
      showToast(`➕ Added ${name} to ${dept}!`);
    }

    function removeAgentUI() {
      const agentToRemove = document.getElementById("removeAgentSelect").value;
      if (!agentToRemove) return;

      const dataObj = parseStructure();
      Object.keys(dataObj).forEach(dept => {
        dataObj[dept] = dataObj[dept].filter(a => a !== agentToRemove);
      });

      document.getElementById("agentData").value = stringifyStructure(dataObj);
      saveToLocal();
      showToast(`🗑️ Removed agent: ${agentToRemove}`);
    }

    function transferAgentUI() {
      const agentToMove = document.getElementById("transferAgentSelect").value;
      const targetDept = document.getElementById("transferDeptSelect").value;
      if (!agentToMove || !targetDept) return;

      const dataObj = parseStructure();
      
      Object.keys(dataObj).forEach(dept => {
        dataObj[dept] = dataObj[dept].filter(a => a !== agentToMove);
      });

      if (!dataObj[targetDept]) dataObj[targetDept] = [];
      dataObj[targetDept].push(agentToMove);

      document.getElementById("agentData").value = stringifyStructure(dataObj);
      saveToLocal();
      showToast(`🔁 Moved ${agentToMove} to ${targetDept}!`);
    }

    function handleSessionChange() {
      const session = document.getElementById("sessionTypeSelect").value;
      const timePicker = document.getElementById("startTimePicker");
      if (session === "Morning Break") {
        timePicker.value = "08:30";
      } else {
        timePicker.value = "17:00";
      }
    }

    function populateDateDropdown() {
      const dateSelect = document.getElementById("dateSelect");
      const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const today = new Date();
      for (let i = 0; i < 7; i++) {
        const nextDate = new Date();
        nextDate.setDate(today.getDate() + i);
        const formattedDate = `${nextDate.getDate()} ${months[nextDate.getMonth()]}`;
        const option = document.createElement("option");
        option.value = formattedDate;
        option.textContent = i === 0 ? `${formattedDate} (Today)` : (i === 1 ? `${formattedDate} (Tomorrow)` : formattedDate);
        dateSelect.appendChild(option);
      }
    }

    function loadTheme() {
      const isLight = localStorage.getItem("theme") === "light";
      if (isLight) {
        document.body.classList.add("light-mode");
        document.getElementById("themeBtn").innerHTML = "🌙 Dark Mode";
      }
    }

    function toggleTheme() {
      document.body.classList.toggle("light-mode");
      const isLight = document.body.classList.contains("light-mode");
      localStorage.setItem("theme", isLight ? "light" : "dark");
      document.getElementById("themeBtn").innerHTML = isLight ? "🌙 Dark Mode" : "☀️ Light Mode";
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    function formatMinsTo12Hr(totalMins) {
      totalMins = totalMins % (24 * 60);
      if (totalMins < 0) totalMins += 24 * 60;
      let hours = Math.floor(totalMins / 60);
      let mins = totalMins % 60;
      let ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      let minStr = mins < 10 ? '0' + mins : mins;
      return `${hours}:${minStr}${ampm}`;
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generateSchedule() {
      const dateStr = document.getElementById("dateSelect").value;
      const sessionType = document.getElementById("sessionTypeSelect").value;
      const rawText = document.getElementById("agentData").value;

      if (!rawText.trim()) {
        showToast("⚠️ Please paste agent list first!");
        return;
      }

      const timeVal = document.getElementById("startTimePicker").value;
      if (!timeVal) {
        alert("Please select a valid start time!");
        return;
      }

      const [h, m] = timeVal.split(':').map(Number);
      let startTotalMins = h * 60 + m;
      const slotDuration = parseInt(document.getElementById("slotDurationSelect").value, 10);
      const totalSlotCount = parseInt(document.getElementById("slotCountSelect").value, 10);

      let slotLabels = [];
      let curr = startTotalMins;
      for (let i = 0; i < totalSlotCount; i++) {
        let next = curr + slotDuration;
        slotLabels.push(`${formatMinsTo12Hr(curr)}-${formatMinsTo12Hr(next)}`);
        curr = next;
      }

      const lobData = parseStructure();
      const slotBuckets = Array.from({ length: totalSlotCount }, () => []);
      let slotDeptMatrix = {};
      let totalAgentsCount = 0;
      let departmentCounts = {};

      Object.keys(lobData).forEach(lob => {
        const agents = lobData[lob];
        if (!agents || agents.length === 0) return;
        
        departmentCounts[lob] = agents.length;
        slotDeptMatrix[lob] = Array(totalSlotCount).fill(0);
        
        const seniorsInLob = [];
        const regularsInLob = [];

        agents.forEach(agent => {
          totalAgentsCount++;
          const cleanName = agent.toLowerCase();
          if (SENIOR_AGENTS.some(s => cleanName === s || cleanName.includes(s))) {
            seniorsInLob.push(agent);
          } else {
            regularsInLob.push(agent);
          }
        });

        shuffleArray(seniorsInLob);
        shuffleArray(regularsInLob);

        let randomOffset = Math.floor(Math.random() * totalSlotCount);
        seniorsInLob.forEach((agent, index) => { 
          let slotIdx = (index + randomOffset) % totalSlotCount;
          slotBuckets[slotIdx].push(agent); 
          slotDeptMatrix[lob][slotIdx]++;
        });
        
        let randomOffsetReg = Math.floor(Math.random() * totalSlotCount);
        regularsInLob.forEach((agent, index) => { 
          let slotIdx = (index + randomOffsetReg) % totalSlotCount;
          slotBuckets[slotIdx].push(agent); 
          slotDeptMatrix[lob][slotIdx]++;
        });
      });

      let breakdownHTML = "";
      Object.keys(departmentCounts).forEach(lob => {
        breakdownHTML += `<span class="breakdown-badge">${lob}: <strong>${departmentCounts[lob]}</strong></span>`;
      });
      document.getElementById("breakdownContainer").innerHTML = breakdownHTML;

      let tableHTML = `
        <table class="slot-matrix-table">
          <thead>
            <tr>
              <th style="text-align:left;">Department</th>`;
      
      slotLabels.forEach((label, idx) => {
        tableHTML += `<th>Slot ${idx + 1}<br>(${label})</th>`;
      });

      tableHTML += `<th>Total</th></tr></thead><tbody>`;

      let slotTotals = Array(totalSlotCount).fill(0);
      let grandTotal = 0;

      Object.keys(slotDeptMatrix).forEach(lob => {
        let counts = slotDeptMatrix[lob];
        let deptTotal = counts.reduce((a, b) => a + b, 0);
        grandTotal += deptTotal;

        tableHTML += `<tr><td class="dept-col">${lob}</td>`;
        counts.forEach((c, idx) => {
          slotTotals[idx] += c;
          tableHTML += `<td class="slot-num">${c}</td>`;
        });
        tableHTML += `<td style="font-weight:700; color:#60a5fa;">${deptTotal}</td></tr>`;
      });

      tableHTML += `<tr class="total-row"><td class="dept-col" style="color:#60a5fa;">Total Slot Agents</td>`;
      slotTotals.forEach(st => {
        tableHTML += `<td>${st}</td>`;
      });
      tableHTML += `<td>${grandTotal}</td></tr>`;

      tableHTML += `</tbody></table>`;
      document.getElementById("slotMatrixContainer").innerHTML = tableHTML;

      let resultText = `*${dateStr} ${sessionType} (${slotDuration}min Break Slot)*\n*No Swap Allowed*\n\n`;

      slotLabels.forEach((slotLabel, index) => {
        resultText += `${slotLabel}\n\n`;
        if (slotBuckets[index].length > 0) {
          resultText += slotBuckets[index].join("\n");
        } else {
          resultText += "No agents assigned";
        }
        resultText += `\n\n`;
      });

      fullGeneratedText = resultText.trim();
      document.getElementById("outputResult").textContent = fullGeneratedText;
      document.getElementById("agentCountBadge").textContent = `Total: ${totalAgentsCount}`;
      document.getElementById("agentSearch").value = "";
      
      const outputCard = document.getElementById("outputCard");
      outputCard.style.display = "block";
      setTimeout(() => outputCard.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
      
      showToast("✨ Schedule Generated Successfully!");
    }

    function filterSchedule() {
      const query = document.getElementById("agentSearch").value.toLowerCase();
      if (!query) {
        document.getElementById("outputResult").textContent = fullGeneratedText;
        return;
      }

      const lines = fullGeneratedText.split('\n');
      const filteredLines = lines.filter(line => {
        if (line.includes("*") || line.includes("M") || line.includes("AM") || line.includes("PM") || line.trim() === "") return true;
        return line.toLowerCase().includes(query);
      });

      document.getElementById("outputResult").textContent = filteredLines.join('\n');
    }

    function copyText() {
      const temp = document.createElement("textarea");
      temp.value = document.getElementById("outputResult").textContent;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      showToast("📋 Text Copied!");
    }

    function downloadText() {
      const text = document.getElementById("outputResult").textContent;
      const dateStr = document.getElementById("dateSelect").value.replace(/\s+/g, '_');
      const sessionType = document.getElementById("sessionTypeSelect").value.replace(/\s+/g, '_');
      const filename = `${dateStr}_${sessionType}_Break_Schedule.txt`;

      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showToast("⬇️ File Downloaded!");
    }

    function exportToImage() {
      const exportArea = document.getElementById("exportableArea");
      showToast("📸 Generating Image...");
      
      html2canvas(exportArea, {
        backgroundColor: "#09090b",
        scale: 2
      }).then(canvas => {
        const link = document.createElement("a");
        const dateStr = document.getElementById("dateSelect").value.replace(/\s+/g, '_');
        link.download = `${dateStr}_Break_Schedule.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        showToast("🖼️ Image Exported Successfully!");
      }).catch(err => {
        showToast("❌ Image export failed.");
      });
    }
  </script>

</body>
